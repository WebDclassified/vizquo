name: CI

# Free tier: runs on GitHub-hosted runners (compile, lint, unit tests, builds,
# and E2E). The E2E job needs a display for the persistent Chromium context, so
# it runs under xvfb — Playwright's standard CI setup for headed extensions.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Manual store release: runs the full release pipeline (bump, validate,
  # build, zip, keyless scan, package) for the requested version and uploads
  # the assembled .output/release/vizquo-<new>/ as a downloadable artifact.
  workflow_dispatch:
    inputs:
      old_version:
        description: 'Current version (must match shared/constants.ts)'
        required: true
        type: string
      new_version:
        description: 'Version to release'
        required: true
        type: string
      screenshots:
        description: 'Regenerate promo tile + store screenshots'
        required: false
        default: true
        type: boolean

jobs:
  check:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx wxt prepare
      - name: Typecheck
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  build:
    name: Build (Chrome + Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Chrome (MV3)
        run: npm run build
      - name: Build Firefox (MV3 — AMO-ready)
        run: npm run build:firefox:mv3
      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3

  landing:
    name: Landing (Chromium · Firefox · WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      # Loads landing/index.html in all three engines and verifies zero console
      # errors, no overflow (desktop + mobile), counters, live demo, download
      # overlay, burger menu, reduced-motion visibility, and that every
      # Download ZIP link resolves 200.
      - name: Cross-browser landing smoke test
        run: npm run check:landing

  e2e:
    name: E2E (Playwright, Chrome)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium
      - name: Build extension
        run: npm run build
      - name: Run E2E smoke tests
        run: xvfb-run -a npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  probe:
    name: Live probes (real Chrome + real sites)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium
      - name: Build extension
        run: npm run build
      # The probes load the built extension in headed Chrome (under xvfb) and
      # drive real user flows. Core + advanced probe checks that need the
      # optional-host-permission prompt report SKIP when automation cannot
      # complete the native prompt — never a failure. The real-sites probe is
      # deterministic (static content scripts inject without a grant); under
      # VQ_PROBE_CI a site that blocks the runner's datacenter IP (auth wall,
      # bot detection, consent redirect) is reported as BLOCKED — visible and
      # counted, but not a failure, because it is an environment artifact, not
      # an extension regression. Genuine failures (connect, context target,
      # lock, scan, console errors) still fail the build everywhere.
      - name: Probe core flows
        run: xvfb-run -a node scripts/probe-extension.mjs
      - name: Probe advanced flows
        run: xvfb-run -a node scripts/probe-extension-advanced.mjs
      - name: QA against real sites
        run: xvfb-run -a node scripts/probe-real-sites.mjs
        env:
          VQ_PROBE_CI: "1"

  release:
    name: Store release pipeline (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run the release pipeline
        run: |
          SCREENSHOTS_FLAG=""
          if [ "${{ inputs.screenshots }}" = "true" ]; then SCREENSHOTS_FLAG="--screenshots"; fi
          npm run release -- "${{ inputs.old_version }}" "${{ inputs.new_version }}" $SCREENSHOTS_FLAG
      - name: QA the released build (live probes)
        run: |
          xvfb-run -a node scripts/probe-extension.mjs
          xvfb-run -a node scripts/probe-extension-advanced.mjs
          node scripts/probe-real-sites.mjs
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: vizquo-${{ inputs.new_version }}-release
          path: .output/release/
